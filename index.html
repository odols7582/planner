<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#3182F6" />
<title>김비서</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="김비서" />
<style>
  :root{
    --blue:#3182F6; --blue-dark:#1B64DA; --blue-soft:#E8F1FE;
    --bg:#F2F4F6; --card:#FFFFFF; --line:#EAECEF;
    --t1:#191F28; --t2:#4E5968; --t3:#8B95A1;
    --red:#F04452; --green:#12B886; --yellow:#F59F00; --purple:#7C4DFF;
    --shadow:0 2px 8px rgba(0,0,0,.06);
    --radius:16px; --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--t1); -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,textarea,select{font-family:inherit;font-size:16px;}
  .hidden{display:none !important;}

  /* ===== 로그인 ===== */
  #auth{
    position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center;
    padding:28px; background:linear-gradient(160deg,#3182F6,#1B64DA);
  }
  .auth-card{
    background:#fff; border-radius:24px; padding:32px 24px; box-shadow:0 12px 40px rgba(0,0,0,.2);
    max-width:400px; width:100%; margin:0 auto;
  }
  .brand{text-align:center; margin-bottom:24px;}
  .brand .logo{font-size:44px;}
  .brand h1{margin:8px 0 4px; font-size:22px; color:var(--t1);}
  .brand p{margin:0; color:var(--t3); font-size:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; color:var(--t2); margin-bottom:6px; font-weight:600;}
  .field input{
    width:100%; padding:14px; border:1.5px solid var(--line); border-radius:12px;
    background:#fff; outline:none; transition:border-color .15s;
  }
  .field input:focus{border-color:var(--blue);}
  .btn-primary{
    width:100%; padding:15px; background:var(--blue); color:#fff; border-radius:12px;
    font-size:16px; font-weight:700; margin-top:6px; transition:background .15s;
  }
  .btn-primary:active{background:var(--blue-dark);}
  .btn-primary:disabled{opacity:.6;}
  .auth-switch{text-align:center; margin-top:18px; font-size:14px; color:var(--t2);}
  .auth-switch b{color:var(--blue); cursor:pointer; margin-left:4px;}
  .auth-msg{font-size:13px; text-align:center; margin-top:12px; min-height:18px; color:var(--red);}
  .auth-msg.ok{color:var(--green);}

  /* ===== 앱 레이아웃 ===== */
  #app{display:none; padding-bottom:calc(72px + var(--safe-b));}
  .topbar{
    position:sticky; top:0; z-index:20; background:rgba(242,244,246,.9); backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:space-between; padding:14px 20px; padding-top:max(14px,env(safe-area-inset-top));
  }
  .topbar h2{margin:0; font-size:20px; font-weight:800;}
  .topbar .u{font-size:12px; color:var(--t3);}
  .icon-btn{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; background:var(--card); box-shadow:var(--shadow);}
  .view{padding:4px 16px 20px; animation:fade .25s;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px;}
  .section-title{font-size:15px; font-weight:800; margin:20px 4px 10px; display:flex; align-items:center; gap:6px;}
  .muted{color:var(--t3);}
  .empty{text-align:center; color:var(--t3); padding:30px 10px; font-size:14px;}
  .empty .e-emoji{font-size:36px; display:block; margin-bottom:8px;}

  /* 대시보드 */
  .greet{font-size:22px; font-weight:800; margin:6px 4px 2px;}
  .greet-sub{color:var(--t2); margin:0 4px 14px; font-size:14px;}
  .stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  .stat{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px;}
  .stat .n{font-size:26px; font-weight:800;}
  .stat .l{font-size:13px; color:var(--t3); margin-top:2px;}
  .stat .ic{font-size:20px;}
  .todo-line{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .todo-line:last-child{border-bottom:none;}
  .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .todo-line .tt{flex:1; font-size:15px;}
  .todo-line .tm{font-size:12px; color:var(--t3);}
  .strike{text-decoration:line-through; color:var(--t3);}

  /* 캘린더 */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .cal-head .m{font-size:18px; font-weight:800;}
  .cal-nav{display:flex; gap:8px;}
  .cal-nav button{width:34px; height:34px; border-radius:10px; background:var(--bg); font-size:16px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-dow{text-align:center; font-size:12px; color:var(--t3); padding:4px 0; font-weight:600;}
  .cal-cell{aspect-ratio:1/1.05; border-radius:10px; display:flex; flex-direction:column; align-items:center; padding-top:6px; font-size:13px; position:relative; background:transparent;}
  .cal-cell.other{color:#C4CAD1;}
  .cal-cell.today{background:var(--blue-soft); font-weight:800; color:var(--blue-dark);}
  .cal-cell.sel{background:var(--blue); color:#fff; font-weight:800;}
  .cal-cell.sun{color:var(--red);}
  .cal-cell.sat{color:var(--blue);}
  .cal-cell.sel.sun,.cal-cell.sel.sat{color:#fff;}
  .cal-dots{display:flex; gap:2px; margin-top:3px; flex-wrap:wrap; justify-content:center; max-width:90%;}
  .cal-dots i{width:5px; height:5px; border-radius:50%; display:block;}
  .day-list-head{display:flex; align-items:center; justify-content:space-between; margin:18px 4px 8px;}
  .day-list-head .d{font-size:16px; font-weight:800;}
  .add-mini{background:var(--blue); color:#fff; border-radius:10px; padding:8px 12px; font-size:13px; font-weight:700;}
  .ev{display:flex; align-items:center; gap:12px; padding:14px; background:var(--card); border-radius:14px; box-shadow:var(--shadow); margin-bottom:10px;}
  .ev .bar{width:4px; align-self:stretch; border-radius:4px;}
  .ev .body{flex:1;}
  .ev .body .t{font-size:15px; font-weight:600;}
  .ev .body .sub{font-size:12px; color:var(--t3); margin-top:2px;}
  .ev .chk{width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff;}
  .ev .chk.on{background:var(--green); border-color:var(--green);}

  /* 리스트형(아이디어/메모) */
  .idea-input{display:flex; gap:8px; margin-bottom:14px;}
  .idea-input input{flex:1; padding:14px; border:1.5px solid var(--line); border-radius:12px; outline:none; background:#fff;}
  .idea-input input:focus{border-color:var(--blue);}
  .idea-input button{background:var(--blue); color:#fff; padding:0 18px; border-radius:12px; font-weight:700;}
  .item{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:16px; margin-bottom:10px; position:relative;}
  .item .txt{font-size:15px; line-height:1.5; white-space:pre-wrap; word-break:break-word;}
  .item .meta{font-size:12px; color:var(--t3); margin-top:8px;}
  .item .del{position:absolute; top:12px; right:12px; color:var(--t3); font-size:18px; padding:4px;}
  .memo-card .mtitle{font-size:16px; font-weight:800; margin-bottom:6px; padding-right:24px;}

  /* 일기 */
  .diary-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:14px;}
  .diary-photos{display:flex; gap:2px; overflow-x:auto;}
  .diary-photos img{height:150px; width:auto; object-fit:cover; flex:0 0 auto;}
  .diary-body{padding:16px;}
  .diary-body .dh{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .diary-body .mood{font-size:24px;}
  .diary-body .ddate{font-size:13px; color:var(--t3); font-weight:600;}
  .diary-body .dtitle{font-size:17px; font-weight:800; margin:2px 0 6px;}
  .diary-body .dtext{font-size:14px; line-height:1.6; color:var(--t2); white-space:pre-wrap; word-break:break-word;}

  /* FAB */
  .fab{position:fixed; right:20px; bottom:calc(84px + var(--safe-b)); width:56px; height:56px; border-radius:50%; background:var(--blue); color:#fff; font-size:28px; box-shadow:0 6px 20px rgba(49,130,246,.45); display:flex; align-items:center; justify-content:center; z-index:30;}

  /* 하단 탭 */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:40; background:rgba(255,255,255,.94); backdrop-filter:blur(12px);
    border-top:1px solid var(--line); display:flex; padding-bottom:var(--safe-b);
  }
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 0 8px; color:var(--t3); font-size:11px; font-weight:600;}
  .tab .ti{font-size:22px; line-height:1;}
  .tab.active{color:var(--blue);}

  /* 모달 */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; display:flex; align-items:flex-end; justify-content:center; animation:fade .2s;}
  .modal{background:#fff; width:100%; max-width:480px; border-radius:24px 24px 0 0; padding:22px 20px calc(22px + var(--safe-b)); max-height:92vh; overflow-y:auto; animation:slideup .28s;}
  @keyframes slideup{from{transform:translateY(40px);opacity:.6;}to{transform:none;opacity:1;}}
  .modal h3{margin:0 0 16px; font-size:19px; font-weight:800;}
  .modal .field textarea{width:100%; padding:14px; border:1.5px solid var(--line); border-radius:12px; outline:none; resize:vertical; min-height:90px; line-height:1.5;}
  .modal .field textarea:focus,.modal .field input:focus{border-color:var(--blue);}
  .modal .field input[type=date],.modal .field input[type=time],.modal .field input[type=text]{width:100%; padding:14px; border:1.5px solid var(--line); border-radius:12px; outline:none; background:#fff;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .mood-pick{display:flex; gap:8px; justify-content:space-between;}
  .mood-pick button{font-size:26px; padding:8px; border-radius:12px; flex:1; background:var(--bg); transition:transform .1s;}
  .mood-pick button.sel{background:var(--blue-soft); transform:scale(1.08);}
  .color-pick{display:flex; gap:10px;}
  .color-pick button{width:34px; height:34px; border-radius:50%; border:3px solid transparent;}
  .color-pick button.sel{border-color:var(--t1);}
  .modal-actions{display:flex; gap:10px; margin-top:8px;}
  .modal-actions .btn-primary{margin-top:0;}
  .btn-ghost{padding:15px; border-radius:12px; background:var(--bg); color:var(--t2); font-weight:700; flex:0 0 auto;}
  .btn-danger{padding:15px 18px; border-radius:12px; background:#FFF0F1; color:var(--red); font-weight:700;}
  .photo-add{display:flex; gap:8px; flex-wrap:wrap;}
  .photo-thumb{position:relative; width:70px; height:70px; border-radius:12px; overflow:hidden;}
  .photo-thumb img{width:100%; height:100%; object-fit:cover;}
  .photo-thumb .x{position:absolute; top:2px; right:2px; background:rgba(0,0,0,.6); color:#fff; width:20px; height:20px; border-radius:50%; font-size:13px; display:flex; align-items:center; justify-content:center;}
  .photo-add label{width:70px; height:70px; border-radius:12px; border:2px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--t3);}

  /* 토스트 */
  #toast{position:fixed; left:50%; bottom:calc(96px + var(--safe-b)); transform:translateX(-50%); background:rgba(25,31,40,.92); color:#fff; padding:12px 20px; border-radius:12px; font-size:14px; z-index:200; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  /* 로딩 */
  #splash{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:300;}
  .spinner{width:36px; height:36px; border:3px solid var(--line); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- 스플래시 -->
<div id="splash"><div class="spinner"></div></div>

<!-- 로그인/회원가입 -->
<div id="auth" class="hidden">
  <div class="auth-card">
    <div class="brand">
      <div class="logo">🗓️</div>
      <h1>김비서</h1>
      <p id="authSubtitle">일정 · 아이디어 · 메모 · 일기를 한곳에</p>
    </div>
    <div class="field">
      <label>이메일</label>
      <input id="inEmail" type="email" placeholder="you@example.com" autocomplete="email" autocapitalize="none" spellcheck="false" />
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input id="inPw" type="password" placeholder="6자 이상" autocomplete="current-password" />
    </div>
    <button id="authBtn" class="btn-primary">로그인</button>
    <div id="authMsg" class="auth-msg"></div>
    <div class="auth-switch" id="switchLine">
      계정이 없으신가요?<b id="switchBtn">회원가입</b>
    </div>
  </div>
</div>

<!-- 앱 -->
<div id="app">
  <div class="topbar">
    <div>
      <h2 id="pageTitle">대시보드</h2>
      <div class="u" id="userLabel"></div>
    </div>
    <button class="icon-btn" id="logoutBtn" title="로그아웃">↩</button>
  </div>

  <div id="viewAdmin" class="view hidden"></div>
  <div id="viewDash" class="view"></div>
  <div id="viewCal" class="view hidden"></div>
  <div id="viewIdea" class="view hidden"></div>
  <div id="viewMemo" class="view hidden"></div>
  <div id="viewDiary" class="view hidden"></div>

  <button class="fab hidden" id="fab">+</button>

  <div class="tabbar">
    <button class="tab hidden" id="adminTab" data-tab="admin"><span class="ti">👑</span>관리자</button>
    <button class="tab active" data-tab="dash"><span class="ti">🏠</span>대시보드</button>
    <button class="tab" data-tab="cal"><span class="ti">📅</span>일정</button>
    <button class="tab" data-tab="idea"><span class="ti">💡</span>아이디어</button>
    <button class="tab" data-tab="memo"><span class="ti">📝</span>메모</button>
    <button class="tab" data-tab="diary"><span class="ti">📔</span>일기</button>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* =========================================================
   1. Firebase 설정  ★★★ 여기만 본인 프로젝트 값으로 교체 ★★★
   Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹) 에서 복사
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCG8hJWK6lCs7IVqa1xG4AHN5WLxvWhF04",
  authDomain: "my-planner-59bf7.firebaseapp.com",
  databaseURL: "https://my-planner-59bf7-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-planner-59bf7",
  storageBucket: "my-planner-59bf7.firebasestorage.app",
  messagingSenderId: "265250715344",
  appId: "1:265250715344:web:df6f4fe0f98e823c5c50d5"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
// 자동 로그인(브라우저에 세션 유지) — 기본값이 LOCAL 이지만 명시
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

/* =========================================================
   2. 전역 상태
   ========================================================= */
let uid = null;
let profileName = "";
const store = { schedules:{}, ideas:{}, memos:{}, diaries:{} };
const listeners = [];
let currentTab = "dash";
let calYear, calMonth, selectedDate;

const $ = (s)=>document.querySelector(s);
const el = (id)=>document.getElementById(id);

/* 유틸 */
function pad(n){return String(n).padStart(2,"0");}
function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function todayStr(){return ymd(new Date());}
function fmtDateK(str){
  const [y,m,dd]=str.split("-").map(Number);
  const d=new Date(y,m-1,dd);
  const w=["일","월","화","수","목","금","토"][d.getDay()];
  return `${m}월 ${dd}일 (${w})`;
}
function relTime(ts){
  const diff=Date.now()-ts, m=60000, h=3600000, day=86400000;
  if(diff<m)return "방금";
  if(diff<h)return Math.floor(diff/m)+"분 전";
  if(diff<day)return Math.floor(diff/h)+"시간 전";
  if(diff<day*7)return Math.floor(diff/day)+"일 전";
  const d=new Date(ts); return `${d.getMonth()+1}.${d.getDate()}`;
}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){const t=el("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800);}
function refPath(p){return db.ref(`users/${uid}/${p}`);}
const EV_COLORS = {blue:"#3182F6", red:"#F04452", green:"#12B886", yellow:"#F59F00", purple:"#7C4DFF"};
const MOODS = ["😀","🙂","😐","😔","😢","😡","😴","🥰"];
const ADMIN_EMAIL = "admin@admin.com"; // 마스터(관리자) 계정 이메일
let isAdmin = false;                 // 현재 로그인 계정이 마스터(관리자)인지
let adminData = {};                  // 관리자 화면용: 전체 사용자 meta

/* =========================================================
   3. 인증
   ========================================================= */
let authMode = "login"; // login | signup

function setAuthMode(mode){
  authMode = mode;
  const signup = mode==="signup";
  el("authSubtitle").textContent = signup ? "이메일과 비밀번호로 가입하세요" : "일정 · 아이디어 · 메모 · 일기를 한곳에";
  el("authBtn").textContent = signup ? "회원가입" : "로그인";
  el("switchLine").innerHTML = signup
    ? `이미 계정이 있으신가요?<b id="switchBtn">로그인</b>`
    : `계정이 없으신가요?<b id="switchBtn">회원가입</b>`;
  el("switchBtn").onclick = ()=>setAuthMode(signup?"login":"signup");
  el("inPw").setAttribute("autocomplete", signup?"new-password":"current-password");
  authMsg("");
}
function authMsg(m, ok){
  const e=el("authMsg"); e.textContent=m; e.classList.toggle("ok", !!ok);
}
function authErrorK(code){
  const map={
    "auth/invalid-email":"이메일 형식이 올바르지 않아요.",
    "auth/user-not-found":"가입되지 않은 이메일이에요.",
    "auth/wrong-password":"비밀번호가 틀렸어요.",
    "auth/invalid-credential":"이메일 또는 비밀번호가 올바르지 않아요.",
    "auth/email-already-in-use":"이미 가입된 이메일이에요.",
    "auth/weak-password":"비밀번호는 6자 이상이어야 해요.",
    "auth/too-many-requests":"잠시 후 다시 시도해 주세요.",
    "auth/network-request-failed":"네트워크 연결을 확인해 주세요."
  };
  return map[code] || "오류가 발생했어요. 다시 시도해 주세요.";
}

el("authBtn").onclick = async ()=>{
  const email = el("inEmail").value.trim().toLowerCase();
  const pw = el("inPw").value;
  if(!email || !pw){ authMsg("이메일과 비밀번호를 입력해 주세요."); return; }
  if(!/^[^\s@]+@[^\s@]+$/.test(email)){ authMsg("이메일 형식으로 입력해 주세요."); return; }
  if(authMode==="signup" && pw.length<6){ authMsg("비밀번호는 6자 이상이어야 해요."); return; }
  const name = email.split("@")[0];   // 표시용 이름(이메일 앞부분)
  const btn=el("authBtn"); btn.disabled=true; btn.textContent="잠시만요…";
  try{
    if(authMode==="signup"){
      const cred = await auth.createUserWithEmailAndPassword(email, pw);
      await cred.user.updateProfile({displayName:name});
      await db.ref(`users/${cred.user.uid}/profile`).set({email, createdAt:Date.now()});
      await db.ref(`meta/${cred.user.uid}`).update({initial:name, email, createdAt:Date.now(), lastLogin:Date.now()});
    }else{
      await auth.signInWithEmailAndPassword(email, pw);
    }
    // onAuthStateChanged 가 이후 화면 전환 처리
  }catch(e){
    authMsg(authErrorK(e.code));
    btn.disabled=false; btn.textContent = authMode==="signup"?"회원가입":"로그인";
  }
};
el("switchBtn").onclick = ()=>setAuthMode("signup");

el("logoutBtn").onclick = ()=>{
  confirmModal("로그아웃", "로그아웃 하시겠어요?", ()=>auth.signOut());
};

auth.onAuthStateChanged(async (user)=>{
  el("splash").classList.add("hidden");
  detachListeners();
  if(user){
    uid = user.uid;
    profileName = user.displayName || (user.email||"").split("@")[0];
    // 마지막 접속 시각 기록(앱 열 때마다 갱신)
    db.ref(`meta/${uid}`).update({ initial: profileName, lastLogin: Date.now() });
    // 마스터(관리자) 계정 여부 확인 (이메일 기준)
    isAdmin = (user.email||"").toLowerCase() === ADMIN_EMAIL;
    el("adminTab").classList.toggle("hidden", !isAdmin);
    el("auth").classList.add("hidden");
    el("app").style.display="block";
    el("userLabel").textContent = isAdmin ? `👑 ${profileName} (관리자)` : `${profileName} 님`;
    attachListeners();
    switchTab(isAdmin ? "admin" : "dash");
  }else{
    uid=null; isAdmin=false;
    el("adminTab").classList.add("hidden");
    el("app").style.display="none";
    el("auth").classList.remove("hidden");
    const btn=el("authBtn"); btn.disabled=false;
    setAuthMode("login");
    el("inPw").value="";
  }
});

/* =========================================================
   4. 실시간 데이터 리스너
   ========================================================= */
function attachListeners(){
  ["schedules","ideas","memos","diaries"].forEach(key=>{
    const r = refPath(key);
    const cb = r.on("value", snap=>{
      store[key] = snap.val() || {};
      // 사용량 집계(관리자가 볼 수 있게 meta에 개수 기록)
      db.ref(`meta/${uid}/counts/${key}`).set(Object.keys(store[key]).length);
      renderCurrent();
    });
    listeners.push({ref:r, cb});
  });
  // 관리자: 전체 사용자 현황 구독
  if(isAdmin){
    const mr = db.ref("meta");
    const mcb = mr.on("value", snap=>{
      adminData = snap.val() || {};
      if(currentTab==="admin") renderAdmin();
    });
    listeners.push({ref:mr, cb:mcb});
  }
}
function detachListeners(){
  listeners.forEach(l=>l.ref.off("value", l.cb));
  listeners.length=0;
  Object.keys(store).forEach(k=>store[k]={});
  adminData = {};
}
function entries(key){
  return Object.entries(store[key]).map(([id,v])=>({id,...v}));
}

const TAB_TITLE = {admin:"관리자 · 사용현황", dash:"대시보드", cal:"일정관리", idea:"아이디어 노트", memo:"메모장", diary:"일기장"};
function switchTab(tab){
  currentTab = tab;

  ["Admin","Dash","Cal","Idea","Memo","Diary"].forEach(v=>el("view"+v).classList.add("hidden"));

  el("fab").classList.toggle("hidden", !showFab);

}

function renderCurrent(){

function fmtYmd(ts){ if(!ts)return "-"; const d=new Date(ts); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; }
function fmtFull(ts){ const d=new Date(ts); const w=["일","월","화","수","목","금","토"][d.getDay()]; return `${d.getMonth()+1}.${d.getDate()}(${w}) ${pad(d.getHours())}:${pad(d.getMinutes())}`; }

/* =========================================================
   7. 일정관리 (캘린더)
   ========================================================= */
function renderCal(){
  const v=el("viewCal");
  const now=new Date();
  if(calYear===undefined){ calYear=now.getFullYear(); calMonth=now.getMonth(); selectedDate=todayStr(); }

  const first=new Date(calYear,calMonth,1);
  const startDow=first.getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const today=todayStr();

  // 날짜별 이벤트 색상 모음
  const byDate={};
  entries("schedules").forEach(s=>{ (byDate[s.date]=byDate[s.date]||[]).push(s.color||"blue"); });

  let cells="";
  const dows=["일","월","화","수","목","금","토"];
  const dowRow=dows.map((d,i)=>`<div class="cal-dow" style="${i===0?'color:var(--red)':i===6?'color:var(--blue)':''}">${d}</div>`).join("");

  for(let i=0;i<42;i++){
    let dayNum, cls="cal-cell", inMonth=true, cellY=calYear, cellM=calMonth;
    if(i<startDow){ dayNum=prevDays-startDow+1+i; inMonth=false; cellM=calMonth-1; if(cellM<0){cellM=11;cellY--;} cls+=" other"; }
    else if(i>=startDow+daysInMonth){ dayNum=i-startDow-daysInMonth+1; inMonth=false; cellM=calMonth+1; if(cellM>11){cellM=0;cellY++;} cls+=" other"; }
    else dayNum=i-startDow+1;
    const dateStr=`${cellY}-${pad(cellM+1)}-${pad(dayNum)}`;
    const dow=(i%7);
    if(dow===0)cls+=" sun"; if(dow===6)cls+=" sat";
    if(dateStr===today)cls+=" today";
    if(dateStr===selectedDate)cls+=" sel";
    const dots=(byDate[dateStr]||[]).slice(0,3).map(c=>`<i style="background:${EV_COLORS[c]||EV_COLORS.blue}"></i>`).join("");
    cells+=`<div class="${cls}" onclick="selectDay('${dateStr}')">${dayNum}<div class="cal-dots">${dots}</div></div>`;
  }

  const dayEvents=entries("schedules").filter(s=>s.date===selectedDate)
    .sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));

  v.innerHTML=`
    <div class="card">
      <div class="cal-head">
        <div class="m">${calYear}년 ${calMonth+1}월</div>
        <div class="cal-nav">
          <button onclick="calMove(-1)">‹</button>
          <button onclick="calToday()">오늘</button>
          <button onclick="calMove(1)">›</button>
        </div>
      </div>
      <div class="cal-grid">${dowRow}${cells}</div>
    </div>

    <div class="day-list-head">
      <div class="d">${fmtDateK(selectedDate)}</div>
      <button class="add-mini" onclick="scheduleModal(null,'${selectedDate}')">+ 일정 추가</button>
    </div>
    <div>
      ${dayEvents.length? dayEvents.map(s=>`
        <div class="ev">
          <div class="bar" style="background:${EV_COLORS[s.color]||EV_COLORS.blue}"></div>
          <div class="chk ${s.done?'on':''}" onclick="toggleDone('${s.id}',event)">${s.done?'✓':''}</div>
          <div class="body" onclick="scheduleModal('${s.id}')">
            <div class="t ${s.done?'strike':''}">${esc(s.title)}</div>
            <div class="sub">${s.time?'⏰ '+esc(s.time)+'  ':''}${s.memo?esc(s.memo):''}</div>
          </div>
        </div>`).join("")
        : `<div class="empty"><span class="e-emoji">🗓️</span>이 날의 일정이 없어요</div>`}
    </div>
  `;
}
function selectDay(d){ selectedDate=d; renderCal(); }
function calMove(dir){ calMonth+=dir; if(calMonth<0){calMonth=11;calYear--;} if(calMonth>11){calMonth=0;calYear++;} renderCal(); }
function calToday(){ const n=new Date(); calYear=n.getFullYear(); calMonth=n.getMonth(); selectedDate=todayStr(); renderCal(); }
function toggleDone(id,e){ e.stopPropagation(); const s=store.schedules[id]; if(s) refPath("schedules/"+id+"/done").set(!s.done); }

function scheduleModal(id, date){
  const editing = !!id;
  const s = editing ? store.schedules[id] : {date:date||selectedDate||todayStr(), color:"blue", time:"", title:"", memo:""};
  openModal(`
    <h3>${editing?"일정 수정":"새 일정"}</h3>
    <div class="field"><label>제목</label><input id="mTitle" type="text" placeholder="무엇을 하나요?" value="${esc(s.title)}"></div>
    <div class="row2">
      <div class="field"><label>날짜</label><input id="mDate" type="date" value="${s.date}"></div>
      <div class="field"><label>시간 (선택)</label><input id="mTime" type="time" value="${s.time||""}"></div>
    </div>
    <div class="field"><label>메모 (선택)</label><textarea id="mMemo" placeholder="상세 내용">${esc(s.memo||"")}</textarea></div>
    <div class="field"><label>색상</label>
      <div class="color-pick" id="mColor">
        ${Object.keys(EV_COLORS).map(c=>`<button data-c="${c}" class="${s.color===c?'sel':''}" style="background:${EV_COLORS[c]}" onclick="pickColor('${c}')"></button>`).join("")}
      </div>
    </div>
    <div class="modal-actions">
      ${editing?`<button class="btn-danger" onclick="delSchedule('${id}')">삭제</button>`:""}
      <button class="btn-primary" style="flex:1" onclick="saveSchedule('${id||""}')">저장</button>
    </div>
  `);
  el("modalRoot")._color = s.color;
}
function pickColor(c){
  el("modalRoot")._color=c;
  document.querySelectorAll("#mColor button").forEach(b=>b.classList.toggle("sel", b.dataset.c===c));
}
function saveSchedule(id){
  const title=el("mTitle").value.trim();
  if(!title){ toast("제목을 입력해 주세요"); return; }
  const data={
    title,
    date:el("mDate").value,
    time:el("mTime").value,
    memo:el("mMemo").value.trim(),
    color:el("modalRoot")._color||"blue"
  };
  if(id){ data.done=store.schedules[id].done||false; refPath("schedules/"+id).update(data); }
  else{ data.done=false; data.createdAt=Date.now(); refPath("schedules").push(data); }
  selectedDate=data.date;
  closeModal(); toast("저장했어요");
}
function delSchedule(id){
  confirmModal("일정 삭제","이 일정을 삭제할까요?",()=>{ refPath("schedules/"+id).remove(); closeModal(); toast("삭제했어요"); });
}

function saveMemo(id){

  const content=el("mmContent").value.trim();

  const data={title, content, updatedAt:Date.now()};
  if(id) refPath("memos/"+id).update(data);
  else { data.createdAt=Date.now(); refPath("memos").push(data); }
  closeModal(); toast("저장했어요");
}
function delMemo(id,e){
  if(e)e.stopPropagation();
  confirmModal("메모 삭제","이 메모를 삭제할까요?",()=>{ refPath("memos/"+id).remove(); closeModal(); toast("삭제했어요"); });
}

/* =========================================================
   10. 일기장
   ========================================================= */
function renderDiary(){
  const v=el("viewDiary");
  const list=entries("diaries").sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));
  v.innerHTML= list.length? list.map(d=>`
      <div class="diary-card" onclick="diaryModal('${d.id}')">
        ${(d.photos&&d.photos.length)?`<div class="diary-photos">${d.photos.map(p=>`<img src="${p}">`).join("")}</div>`:""}
        <div class="diary-body">
          <div class="dh"><span class="mood">${d.mood||"🙂"}</span><span class="ddate">${fmtDateK(d.date)}</span></div>
          ${d.title?`<div class="dtitle">${esc(d.title)}</div>`:""}
          <div class="dtext">${esc(d.content)}</div>
        </div>
      </div>`).join("")
    : `<div class="empty"><span class="e-emoji">📔</span>아직 일기가 없어요<br>오늘의 감정과 있었던 일을 기록해 보세요<br><br>우측 하단 <b>+</b> 버튼으로 작성</div>`;
}

let diaryPhotos = []; // 편집 중 사진(base64) 임시 저장
function diaryModal(id){
  const editing=!!id;
  const d=editing?store.diaries[id]:{date:todayStr(), mood:"🙂", title:"", content:"", photos:[]};
  diaryPhotos = (d.photos||[]).slice();
  openModal(`
    <h3>${editing?"일기 수정":"오늘의 일기"}</h3>
    <div class="field"><label>날짜</label><input id="dDate" type="date" value="${d.date}"></div>
    <div class="field"><label>오늘의 기분</label>
      <div class="mood-pick" id="dMood">
        ${MOODS.map(mo=>`<button class="${d.mood===mo?'sel':''}" onclick="pickMood('${mo}')">${mo}</button>`).join("")}
      </div>
    </div>
    <div class="field"><label>제목 (선택)</label><input id="dTitle" type="text" placeholder="오늘을 한마디로" value="${esc(d.title||"")}"></div>
    <div class="field"><label>내용</label><textarea id="dContent" style="min-height:140px" placeholder="오늘 있었던 일, 느낀 감정을 자유롭게 적어보세요">${esc(d.content||"")}</textarea></div>
    <div class="field"><label>사진 (선택)</label>
      <div class="photo-add" id="dPhotos"></div>
    </div>
    <div class="modal-actions">
      ${editing?`<button class="btn-danger" onclick="delDiary('${id}')">삭제</button>`:""}
      <button class="btn-primary" style="flex:1" onclick="saveDiary('${id||""}')">저장</button>
    </div>
  `);
  el("modalRoot")._mood = d.mood||"🙂";
  renderPhotoRow();
}
function pickMood(mo){
  el("modalRoot")._mood=mo;
  document.querySelectorAll("#dMood button").forEach(b=>b.classList.toggle("sel", b.textContent===mo));
}
function renderPhotoRow(){
  const row=el("dPhotos");
  row.innerHTML = diaryPhotos.map((p,i)=>`
    <div class="photo-thumb"><img src="${p}"><div class="x" onclick="removePhoto(${i})">×</div></div>`).join("")
    + `<label>+<input type="file" accept="image/*" multiple style="display:none" onchange="addPhotos(this.files)"></label>`;
}
function removePhoto(i){ diaryPhotos.splice(i,1); renderPhotoRow(); }
async function addPhotos(files){
  for(const f of files){
    if(diaryPhotos.length>=6){ toast("사진은 최대 6장까지예요"); break; }
    try{ diaryPhotos.push(await compressImage(f)); }catch(e){ toast("이미지를 불러오지 못했어요"); }
  }
  renderPhotoRow();
}
// 이미지 압축 → base64 (긴 변 900px, JPEG 품질 0.7)
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const max=900;
        let {width:w,height:h}=img;
        if(w>h && w>max){ h=h*max/w; w=max; }
        else if(h>=w && h>max){ w=w*max/h; h=max; }
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        resolve(cv.toDataURL("image/jpeg",0.7));
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
function saveDiary(id){
  const content=el("dContent").value.trim();
  const title=el("dTitle").value.trim();
  if(!content && !title && diaryPhotos.length===0){ toast("내용을 입력해 주세요"); return; }
  const data={
    date:el("dDate").value,
    mood:el("modalRoot")._mood||"🙂",
    title, content,
    photos:diaryPhotos.slice(),
    updatedAt:Date.now()
  };
  if(id) refPath("diaries/"+id).update(data);
  else { data.createdAt=Date.now(); refPath("diaries").push(data); }
  closeModal(); toast("저장했어요");
}
function delDiary(id){
  confirmModal("일기 삭제","이 일기를 삭제할까요?",()=>{ refPath("diaries/"+id).remove(); closeModal(); toast("삭제했어요"); });
}

/* =========================================================
   11. 모달 공통
   ========================================================= */
function openModal(html){
  const root=el("modalRoot");
  root.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
  document.body.style.overflow="hidden";
}
function closeModal(){ el("modalRoot").innerHTML=""; document.body.style.overflow=""; }
function confirmModal(title,msg,onOk){
  openModal(`
    <h3>${esc(title)}</h3>
    <p style="color:var(--t2); margin:0 0 18px; line-height:1.5;">${esc(msg)}</p>
    <div class="modal-actions">
      <button class="btn-ghost" style="flex:1" onclick="closeModal()">취소</button>
      <button class="btn-primary" style="flex:1" id="cfmOk">확인</button>
    </div>
  `);
  el("cfmOk").onclick=()=>{ onOk(); };
}

/* 초기 진입: 로그인 폼 준비 */
el("auth").classList.remove("hidden");
setAuthMode("login");

/* 안전장치: 3초 내 인증 상태가 안 잡히면 스플래시 강제 해제(로그인 화면 노출) */

  }
}, 3000);

/* =========================================================
   PWA: 바탕화면 설치 안내
   ========================================================= */
let deferredPrompt = null;
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function installSnoozed(){ return Date.now() < (+(localStorage.getItem("installSnooze")||0)); }
function snoozeInstall(days){ localStorage.setItem("installSnooze", String(Date.now()+days*86400000)); }
function closeInstall(){ const b=document.getElementById("installSheet"); if(b) b.remove(); }

function showInstallSheet(mode){   // 'prompt'(안드로이드/데스크톱) | 'ios'
  if(isStandalone() || installSnoozed() || document.getElementById("installSheet")) return;
  const sheet=document.createElement("div");
  sheet.id="installSheet";
  sheet.style.cssText="position:fixed;left:12px;right:12px;bottom:16px;z-index:600;background:#fff;border-radius:20px;box-shadow:0 10px 36px rgba(0,0,0,.28);padding:18px;max-width:440px;margin:0 auto;animation:slideup .3s;";
  if(mode==="ios"){
    sheet.innerHTML=`
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
        <img src="icon-192.png" style="width:46px;height:46px;border-radius:12px;">
        <div><div style="font-weight:800;font-size:16px;">김비서 홈 화면에 추가</div>
        <div style="font-size:12px;color:#4E5968;">앱처럼 전체화면으로 사용하세요</div></div>
      </div>
      <div style="font-size:13px;color:#4E5968;line-height:1.7;background:#F2F4F6;border-radius:12px;padding:12px;">
        1. 하단 <b>공유</b> 버튼 <span style="font-size:16px;">⬆️</span> 을 누르세요<br>
        2. <b>'홈 화면에 추가'</b> 를 선택하세요
      </div>
      <button onclick="snoozeInstall(7);closeInstall();" style="width:100%;margin-top:12px;padding:13px;border-radius:12px;background:#3182F6;color:#fff;font-weight:700;font-size:15px;border:none;">확인</button>`;
  }else{
    sheet.innerHTML=`
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="icon-192.png" style="width:46px;height:46px;border-radius:12px;">
        <div style="flex:1;"><div style="font-weight:800;font-size:16px;">김비서 설치</div>
        <div style="font-size:12px;color:#4E5968;">바탕화면에 추가하고 앱처럼 사용하세요</div></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button id="instLater" style="flex:1;padding:13px;border-radius:12px;background:#F2F4F6;color:#4E5968;font-weight:700;border:none;">나중에</button>
        <button id="instYes" style="flex:1;padding:13px;border-radius:12px;background:#3182F6;color:#fff;font-weight:700;border:none;">설치</button>
      </div>`;
  }
  document.body.appendChild(sheet);
  if(mode==="prompt"){
    document.getElementById("instLater").onclick=()=>{ snoozeInstall(3); closeInstall(); };
    document.getElementById("instYes").onclick=async ()=>{
      closeInstall();
      if(deferredPrompt){ deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; }
    };
  }
}

window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  setTimeout(()=>showInstallSheet("prompt"), 1200);
});
window.addEventListener("appinstalled",()=>{ closeInstall(); snoozeInstall(3650); });

// iOS(사파리)는 beforeinstallprompt 미지원 → 접속 시 수동 추가 안내
if(isIOS() && !isStandalone()){ setTimeout(()=>showInstallSheet("ios"), 1500); }
</script>
