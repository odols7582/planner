<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#3182F6" />
<title>김비서</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="김비서" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#3182F6; --blue-dark:#1B64DA; --blue-soft:#E8F1FE;
    --bg:#F2F4F6; --card:#FFFFFF; --line:#EAECEF;
    --t1:#191F28; --t2:#4E5968; --t3:#8B95A1;
    --red:#F04452; --green:#12B886; --yellow:#F59F00; --purple:#7C4DFF;
    --shadow:0 2px 8px rgba(0,0,0,.06);
    --radius:16px; --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans KR','맑은 고딕','Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--t1); -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none; font-size:13px; letter-spacing:-.3px;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,textarea,select{font-family:inherit;font-size:14px;letter-spacing:-.3px;}
  .hidden{display:none !important;}

  /* ===== 로그인 ===== */
  #auth{
    position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center;
    padding:28px; background:linear-gradient(160deg,#3182F6,#1B64DA);
  }
  .auth-card{
    background:#fff; border-radius:24px; padding:32px 24px; box-shadow:0 12px 40px rgba(0,0,0,.2);
    max-width:400px; width:100%; margin:0 auto;
  }
  .brand{text-align:center; margin-bottom:24px;}
  .brand .logo{width:74px;height:74px;border-radius:18px;box-shadow:0 6px 16px rgba(49,130,246,.35);}
  .brand h1{margin:8px 0 4px; font-size:18px; color:var(--t1); font-weight:800;}
  .brand p{margin:0; color:var(--t3); font-size:12.5px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; color:var(--t2); margin-bottom:6px; font-weight:600;}
  .field input{
    width:100%; padding:14px; border:1.5px solid var(--line); border-radius:12px;
    background:#fff; outline:none; transition:border-color .15s;
  }
  .field input:focus{border-color:var(--blue);}
  .btn-primary{
    width:100%; padding:15px; background:var(--blue); color:#fff; border-radius:12px;
    font-size:14px; font-weight:700; margin-top:6px; transition:background .15s;
  }
  .btn-primary:active{background:var(--blue-dark);}
  .btn-primary:disabled{opacity:.6;}
  .auth-switch{text-align:center; margin-top:18px; font-size:12.5px; color:var(--t2);}
  .auth-switch b{color:var(--blue); cursor:pointer; margin-left:4px;}
  .auth-msg{font-size:13px; text-align:center; margin-top:12px; min-height:18px; color:var(--red);}
  .auth-msg.ok{color:var(--green);}

  /* ===== 앱 레이아웃 ===== */
  #app{display:none; padding-bottom:calc(72px + var(--safe-b));}
  .topbar{
    position:relative; z-index:20; background:var(--bg);
    display:flex; align-items:center; justify-content:space-between; padding:12px 20px;
  }
  /* 상단 버전바 */
  .verbar{position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 14px; padding-top:max(6px,env(safe-area-inset-top)); background:#111927; color:#C9D2DE;}
  .verbar .ver{font-size:10.5px; line-height:1.35; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;}
  .verbar .ver b{color:#fff; font-weight:800;}
  .verbar .ver .vt{color:#8B95A1;}
  .ver-actions{display:flex; gap:6px; flex:0 0 auto;}
  .ver-btn{background:rgba(255,255,255,.13); color:#fff; border-radius:8px; padding:6px 9px; font-size:12px; line-height:1; display:flex; align-items:center; gap:4px; font-weight:600;}
  .ver-btn .lbl{font-size:11px;}
  .ver-btn.on{background:var(--green);}
  .ver-btn.off{background:var(--red);}
  /* 시간 휠 피커 */
  .tp{position:relative; display:flex; align-items:center; justify-content:center; gap:2px; height:176px; margin:2px 0 8px; user-select:none;}
  .tp-band{position:absolute; left:10%; right:10%; top:66px; height:44px; background:var(--blue-soft); border-radius:14px; pointer-events:none;}
  .tp-col{position:relative; height:176px; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; -ms-overflow-style:none; text-align:center; padding:66px 0;}
  .tp-col::-webkit-scrollbar{display:none;}
  .tp-col .it{height:44px; line-height:44px; scroll-snap-align:center; font-size:22px; font-weight:700; color:var(--t3); transition:color .12s, transform .12s;}
  .tp-col .it.sel{color:var(--blue-dark); font-weight:800; transform:scale(1.06);}
  .tp-col.ampm{width:64px;} .tp-col.hh{width:56px;} .tp-col.mm{width:56px;}
  .tp-colon{font-size:22px; font-weight:800; color:var(--t2); padding-bottom:2px;}
  /* 알람(푸시) 시점 칩 */
  .alarm-chips{display:flex; gap:7px; flex-wrap:wrap;}
  .alarm-chips button{padding:8px 12px; border-radius:10px; background:var(--bg); color:var(--t2); font-size:12.5px; font-weight:700;}
  .alarm-chips button.sel{background:var(--blue); color:#fff;}
  .allday-row{display:flex; align-items:center; justify-content:space-between; background:var(--bg); border-radius:12px; padding:11px 14px; margin:2px 0 8px; font-size:13px; font-weight:700; color:var(--t2);}
  .allday-row input{width:20px; height:20px; accent-color:var(--blue);}
  .tp.dim{opacity:.32; pointer-events:none;}
  .topbar h2{margin:0; font-size:15px; font-weight:800;}
  .top-right{display:flex; align-items:center; gap:8px;}
  .weather-chip{display:flex; align-items:center; gap:4px; background:var(--card); box-shadow:var(--shadow); border-radius:14px; padding:7px 12px; font-size:13px; font-weight:800; color:var(--t1);}
  .topbar .u{font-size:12px; color:var(--t3);}
  .icon-btn{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; background:var(--card); box-shadow:var(--shadow);}
  .view{padding:4px 16px 20px; animation:fade .25s;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px;}
  .section-title{font-size:13px; font-weight:800; margin:20px 4px 10px; display:flex; align-items:center; gap:6px;}
  .muted{color:var(--t3);}
  .empty{text-align:center; color:var(--t3); padding:30px 10px; font-size:14px;}
  .empty .e-emoji{font-size:36px; display:block; margin-bottom:8px;}

  /* 대시보드 */
  .greet{font-size:16px; font-weight:800; margin:6px 4px 2px;}
  .qadd{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px; margin-bottom:14px;}
  .qadd-cats{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
  .qadd-cats button{padding:6px 11px; border-radius:10px; background:var(--bg); color:var(--t2); font-size:12px; font-weight:700;}
  .qadd-cats button.sel{background:var(--blue); color:#fff;}
  .qadd-row{display:flex; gap:8px;}
  .qadd-row input{flex:1; padding:12px; border:1.5px solid var(--line); border-radius:12px; outline:none; background:#fff;}
  .qadd-row input:focus{border-color:var(--blue);}
  .qadd-row button{background:var(--blue); color:#fff; padding:0 16px; border-radius:12px; font-weight:700;}
  .greet-sub{color:var(--t2); margin:0 4px 14px; font-size:12.5px;}
  /* 날씨 카드 (배경은 날씨에 따라 변경) */
  .weather{border-radius:20px; padding:18px; color:#fff; margin:2px 0 16px; position:relative; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.13);}
  .weather.loading{background:#C9D2DE; color:#6B7684; text-align:center; font-size:12.5px; padding:24px; box-shadow:none;}
  .weather .w-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .weather .w-loc{font-size:12.5px; font-weight:700; opacity:.96;}
  .weather .w-emoji{font-size:36px; line-height:1;}
  .weather .w-temp{font-size:40px; font-weight:800; line-height:1; margin-top:6px;}
  .weather .w-desc{font-size:14px; font-weight:700; margin-top:4px;}
  .weather .w-range{font-size:12px; opacity:.92; margin-top:6px; font-weight:600;}
  .w-clear-day{background:linear-gradient(150deg,#5AB0F7,#2E7FE4);}
  .w-clear-night{background:linear-gradient(150deg,#26407A,#101A33);}
  .w-cloudy{background:linear-gradient(150deg,#8493A8,#5B6A80);}
  .w-fog{background:linear-gradient(150deg,#9AA4B0,#6B7580);}
  .w-rain{background:linear-gradient(150deg,#4A6580,#293A4F);}
  .w-snow{background:linear-gradient(150deg,#7FA8CC,#587FA8);}
  .w-storm{background:linear-gradient(150deg,#3E3857,#201D30);}
  .weather{cursor:pointer;}
  .w-top-r{display:flex; align-items:center; gap:10px;}
  .w-citybtn{background:rgba(255,255,255,.22); color:#fff; font-size:11px; font-weight:700; padding:5px 9px; border-radius:8px;}
  .w-hourly{display:flex; justify-content:space-between; gap:4px; margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.24);}
  .w-hcol{display:flex; flex-direction:column; align-items:center; gap:5px; flex:1;}
  .w-ht{font-size:11px; font-weight:700;}
  .w-hbar{width:6px; border-radius:3px; background:rgba(255,255,255,.85);}
  .w-htime{font-size:10.5px; opacity:.9; font-weight:600;}
  .w-more{text-align:center; font-size:11.5px; opacity:.85; margin-top:12px; font-weight:600;}
  .w-detail{margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,.24);}
  .w-stats{display:flex; gap:18px; font-size:12.5px; font-weight:700; margin-bottom:12px;}
  .w-week{display:flex; flex-direction:column;}
  .w-day{display:flex; align-items:center; font-size:12.5px; font-weight:600; padding:5px 0;}
  .w-day+.w-day{border-top:1px solid rgba(255,255,255,.16);}
  .w-dn{width:38px;} .w-de{width:30px; font-size:15px;} .w-dmax{flex:1; text-align:right; font-weight:800;} .w-dmin{width:44px; text-align:right; opacity:.82;}
  .stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  .stat{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px;}
  .stat .n{font-size:20px; font-weight:800;}
  .stat .l{font-size:13px; color:var(--t3); margin-top:2px;}
  .stat .ic{font-size:20px;}
  .todo-line{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .todo-line:last-child{border-bottom:none;}
  .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .todo-line .tt{flex:1; font-size:15px;}
  .todo-line .tm{font-size:12px; color:var(--t3);}
  .strike{text-decoration:line-through; color:var(--t3);}

  /* 캘린더 */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .cal-head .m{font-size:15px; font-weight:800;}
  .cal-nav{display:flex; gap:8px;}
  .cal-nav button{min-width:34px; height:34px; padding:0 7px; border-radius:10px; background:var(--bg); font-size:15px; font-weight:700; color:var(--t2); display:flex; align-items:center; justify-content:center;}
  .cal-nav button.today{padding:0 13px; font-size:12.5px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-dow{text-align:center; font-size:12px; color:var(--t3); padding:4px 0; font-weight:600;}
  .cal-cell{aspect-ratio:1/1.05; border-radius:10px; display:flex; flex-direction:column; align-items:center; padding-top:6px; font-size:13px; position:relative; background:transparent;}
  .cal-cell.other{color:#C4CAD1;}
  .cal-cell.today{background:var(--blue-soft); font-weight:800; color:var(--blue-dark);}
  .cal-cell.sel{background:var(--blue); color:#fff; font-weight:800;}
  .cal-cell.sun{color:var(--red);}
  .cal-cell.sat{color:var(--blue);}
  .cal-cell.sel.sun,.cal-cell.sel.sat{color:#fff;}
  .cal-cell.hol{color:var(--red);}
  .cal-cell.sel.hol{color:#fff;}
  .cal-hol{font-size:8px; color:var(--red); font-weight:700; line-height:1.05; margin-top:1px; max-width:100%; padding:0 1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cal-cell.sel .cal-hol{color:#fff;}
  .cal-dots{display:flex; gap:2px; margin-top:3px; flex-wrap:wrap; justify-content:center; max-width:90%;}
  .cal-dots i{width:5px; height:5px; border-radius:50%; display:block;}
  .day-list-head{display:flex; align-items:center; justify-content:space-between; margin:18px 4px 8px;}
  .day-list-head .d{font-size:16px; font-weight:800;}
  .add-mini{background:var(--blue); color:#fff; border-radius:10px; padding:8px 12px; font-size:13px; font-weight:700;}
  .ev{display:flex; align-items:center; gap:12px; padding:14px; background:var(--card); border-radius:14px; box-shadow:var(--shadow); margin-bottom:10px;}
  .ev .bar{width:4px; align-self:stretch; border-radius:4px;}
  .ev .body{flex:1;}
  .ev .body .t{font-size:13.5px; font-weight:600;}
  .ev .body .sub{font-size:12px; color:var(--t3); margin-top:2px;}
  .ev .chk{width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff;}
  .ev .chk.on{background:var(--green); border-color:var(--green);}

  /* 리스트형(아이디어/메모) */
  .idea-input{display:flex; gap:8px; margin-bottom:14px;}
  .idea-input input{flex:1; padding:14px; border:1.5px solid var(--line); border-radius:12px; outline:none; background:#fff;}
  .idea-input input:focus{border-color:var(--blue);}
  .idea-input button{background:var(--blue); color:#fff; padding:0 18px; border-radius:12px; font-weight:700;}
  .item{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:16px; margin-bottom:10px; position:relative;}
  .item .txt{font-size:13.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word;}
  .item .meta{font-size:12px; color:var(--t3); margin-top:8px;}
  .item .del{position:absolute; top:12px; right:12px; color:var(--t3); font-size:18px; padding:4px;}
  .memo-card .mtitle{font-size:16px; font-weight:800; margin-bottom:6px; padding-right:24px;}
  .mfilter{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
  .mfilter button{display:flex; align-items:center; gap:5px; padding:6px 11px; border-radius:10px; background:var(--card); box-shadow:var(--shadow); color:var(--t2); font-size:12px; font-weight:700;}
  .mfilter button.sel{background:var(--t1); color:#fff;}
  .mfilter .fdot{width:11px; height:11px; border-radius:50%;}
  .mcolor-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .mcolor-sw{width:30px; height:30px; border-radius:50%; border:3px solid transparent;}
  .mcolor-sw.sel{border-color:var(--t1);}
  .mcolor-add{width:30px; height:30px; border-radius:50%; border:2px dashed var(--line); color:var(--t3); display:flex; align-items:center; justify-content:center; font-size:16px;}
  .mhead{display:flex; align-items:center; gap:9px; margin-bottom:6px; padding-right:24px;}
  .mhead .mtitle{margin-bottom:0; padding-right:0;}
  .mstatus{flex:0 0 auto; padding:4px 10px; border-radius:8px; font-size:11px; font-weight:800; background:var(--bg); color:var(--t3);}
  .mstatus.done{background:#E7F7EF; color:#12855C;}
  .memo-card.done{opacity:.55;}
  .memo-card.done .mtitle{text-decoration:line-through;}

  /* 일기 */
  .diary-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:14px;}
  .diary-photos{display:flex; gap:2px; overflow-x:auto;}
  .diary-photos img{height:150px; width:auto; object-fit:cover; flex:0 0 auto;}
  .diary-body{padding:16px;}
  .diary-body .dh{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .diary-body .mood{font-size:24px;}
  .diary-body .ddate{font-size:13px; color:var(--t3); font-weight:600;}
  .diary-body .dtitle{font-size:14.5px; font-weight:800; margin:2px 0 6px;}
  .diary-body .dtext{font-size:14px; line-height:1.6; color:var(--t2); white-space:pre-wrap; word-break:break-word;}

  /* FAB */
  .fab{position:fixed; right:20px; bottom:calc(84px + var(--safe-b)); width:56px; height:56px; border-radius:50%; background:var(--blue); color:#fff; font-size:28px; box-shadow:0 6px 20px rgba(49,130,246,.45); display:flex; align-items:center; justify-content:center; z-index:30;}

  /* 하단 탭 */
  /* 하단 네비바 — 가계부와 동일한 떠있는 알약형 */
  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:40; max-width:480px; margin:0 auto; background:transparent; padding:10px 14px max(12px,var(--safe-b));}
  .tabbar-inner{display:flex; justify-content:space-around; background:#2D3338; border-radius:22px; padding:11px 8px; box-shadow:0 8px 24px rgba(0,0,0,.18);}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 2px; color:#8A9098; font-size:11px; font-weight:600; background:none; border:none;}
  .tab .ti{font-size:19px; line-height:1;}
  .tab.active{color:#5DA8FF;}
  /* 모달 내 카드 */
  .mcard{background:var(--bg); border-radius:14px; padding:14px; margin-bottom:10px;}
  .mcard .field:last-child{margin-bottom:0;}
  /* 업데이트 로딩 오버레이 */
  #updating{position:fixed; inset:0; z-index:500; background:linear-gradient(160deg,#3182F6,#1B64DA); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; color:#fff;}
  #updating img{width:76px; height:76px; border-radius:18px; box-shadow:0 8px 24px rgba(0,0,0,.3);}
  #updating .ut{font-size:15px; font-weight:800;} #updating .us{font-size:12px; opacity:.85;}
  #updating .uspin{width:30px; height:30px; border:3px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite;}

  /* 모달 */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; display:flex; align-items:flex-end; justify-content:center; animation:fade .2s;}
  .modal{background:#fff; width:100%; max-width:480px; border-radius:24px 24px 0 0; padding:22px 20px calc(22px + var(--safe-b)); max-height:92vh; overflow-y:auto; animation:slideup .28s;}
  @keyframes slideup{from{transform:translateY(40px);opacity:.6;}to{transform:none;opacity:1;}}
  .modal h3{margin:0 0 16px; font-size:15px; font-weight:800;}
  .modal .field textarea{width:100%; padding:14px; border:1.5px solid var(--line); border-radius:12px; outline:none; resize:vertical; min-height:90px; line-height:1.5;}
  .modal .field textarea:focus,.modal .field input:focus{border-color:var(--blue);}
  .modal .field input[type=date],.modal .field input[type=time],.modal .field input[type=text]{width:100%; padding:14px; border:1.5px solid var(--line); border-radius:12px; outline:none; background:#fff;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .mood-pick{display:flex; gap:8px; justify-content:space-between;}
  .mood-pick button{font-size:26px; padding:8px; border-radius:12px; flex:1; background:var(--bg); transition:transform .1s;}
  .mood-pick button.sel{background:var(--blue-soft); transform:scale(1.08);}
  .color-pick{display:flex; gap:10px;}
  .color-pick button{width:34px; height:34px; border-radius:50%; border:3px solid transparent;}
  .color-pick button.sel{border-color:var(--t1);}
  .modal-actions{display:flex; gap:10px; margin-top:8px;}
  .modal-actions .btn-primary{margin-top:0;}
  .btn-ghost{padding:15px; border-radius:12px; background:var(--bg); color:var(--t2); font-weight:700; flex:0 0 auto;}

   ========================================================= */
function attachListeners(){
  ["schedules","ideas","memos","diaries"].forEach(key=>{
    const r = refPath(key);
    const cb = r.on("value", snap=>{
      store[key] = snap.val() || {};
      // 사용량 집계(관리자가 볼 수 있게 meta에 개수 기록)
      db.ref(`meta/${uid}/counts/${key}`).set(Object.keys(store[key]).length);
      renderCurrent();
      if(key==="schedules"||key==="memos") setTimeout(checkAlarms,200);
    });
    listeners.push({ref:r, cb});
  });
  // 메모 색상 팔레트 구독(없으면 기본값으로 초기화)
  const cr = refPath("memoColors");
  const ccb = cr.on("value", snap=>{
    const val = snap.val();
    if(!val){ refPath("memoColors").set(DEFAULT_MEMO_COLORS); memoColors=DEFAULT_MEMO_COLORS.slice(); }
    else { memoColors = Array.isArray(val)? val : Object.values(val); }
    if(currentTab==="memo") renderMemo();
  });
  listeners.push({ref:cr, cb:ccb});
  // 관리자: 전체 사용자 현황 + 개선 요청 구독
  if(isAdmin){
    const mr = db.ref("meta");
    const mcb = mr.on("value", snap=>{
      adminData = snap.val() || {};
      if(currentTab==="admin") renderAdmin();
    });
    listeners.push({ref:mr, cb:mcb});
    const fr = db.ref("feedback");
    const fcb = fr.on("value", snap=>{
      adminFeedback = snap.val() || {};
      if(currentTab==="admin") renderAdmin();
    });
    listeners.push({ref:fr, cb:fcb});
  }
}
function detachListeners(){
  listeners.forEach(l=>l.ref.off("value", l.cb));
  listeners.length=0;
  Object.keys(store).forEach(k=>store[k]={});
  adminData = {}; adminFeedback = {};
}
function entries(key){
  return Object.entries(store[key]).map(([id,v])=>({id,...v}));
}

/* =========================================================
   5-2. 날씨 카드 (Open-Meteo · 무료/키불필요)
   ========================================================= */
function mapWeather(code, isDay){
  const d = isDay!==0; const c = Number(code);
  if(c===0) return d?{label:"맑음",emoji:"☀️",cls:"w-clear-day"}:{label:"맑은 밤",emoji:"🌙",cls:"w-clear-night"};
  if(c===1||c===2) return d?{label:"구름 조금",emoji:"🌤️",cls:"w-clear-day"}:{label:"구름 조금",emoji:"☁️",cls:"w-clear-night"};
  if(c===3) return {label:"흐림",emoji:"☁️",cls:"w-cloudy"};
  if(c===45||c===48) return {label:"안개",emoji:"🌫️",cls:"w-fog"};
  if(c>=51&&c<=57) return {label:"이슬비",emoji:"🌦️",cls:"w-rain"};
  if((c>=61&&c<=67)||(c>=80&&c<=82)) return {label:"비",emoji:"🌧️",cls:"w-rain"};
  if((c>=71&&c<=77)||c===85||c===86) return {label:"눈",emoji:"❄️",cls:"w-snow"};
  if(c>=95) return {label:"뇌우",emoji:"⛈️",cls:"w-storm"};
  return {label:"흐림",emoji:"☁️",cls:"w-cloudy"};
}
function buildHourly(h, curTime){
  if(!h||!h.time) return [];
  const times=h.time, temps=h.temperature_2m||[];
  const key=(curTime||"").slice(0,13);
  let start=times.findIndex(t=>String(t).slice(0,13)===key);
  if(start<0) start=0;
  const out=[];
  for(let i=start;i<times.length && out.length<6;i+=3){
    const hh=new Date(times[i]).getHours();
    out.push({ time: out.length===0?"지금":(hh+"시"), temp:Math.round(temps[i]) });
  }
  return out;
}
function buildDaily(d){
  if(!d||!d.time) return [];
  const WD=["일","월","화","수","목","금","토"];
  const out=[];
  for(let i=0;i<d.time.length && i<7;i++){
    const dt=new Date(d.time[i]+"T00:00:00");
    const m=mapWeather((d.weather_code||[])[i], 1);
    out.push({ wname: i===0?"오늘":WD[dt.getDay()], emoji:m.emoji, max:Math.round((d.temperature_2m_max||[])[i]), min:Math.round((d.temperature_2m_min||[])[i]) });
  }
  return out;
}
function updateWeatherChip(){

function weatherFullCard(){
  if(!weatherData) return `<div class="weather loading">🌤️ 날씨 불러오는 중…</div>`;
  const w=weatherData;
  let hourly="";
  if(w.hourly&&w.hourly.length){

    hourly=`<div class="w-hourly">`+w.hourly.map(x=>{
      const hgt=14+Math.round((x.temp-mn)/sp*22);
      return `<div class="w-hcol"><span class="w-ht">${x.temp}°</span><span class="w-hbar" style="height:${hgt}px"></span><span class="w-htime">${esc(x.time)}</span></div>`;
    }).join("")+`</div>`;
  }
  const wk=(w.daily||[]).map(d=>`<div class="w-day"><span class="w-dn">${esc(d.wname)}</span><span class="w-de">${d.emoji}</span><span class="w-dmax">${d.max}°</span><span class="w-dmin">${d.min}°</span></div>`).join("");
  return `<div class="weather ${w.cls}" style="cursor:default;box-shadow:none;">
    <div class="w-top"><span class="w-loc">📍 ${esc(w.city||"현재 위치")}</span><span class="w-emoji">${w.emoji}</span></div>
    <div class="w-temp">${w.temp}°</div>
    <div class="w-desc">${esc(w.label)}</div>
    ${(w.max!=null&&w.min!=null)?`<div class="w-range">최고 ${w.max}° · 최저 ${w.min}°</div>`:""}
    ${hourly}
    <div class="w-detail">
      <div class="w-stats"><span>💧 습도 ${w.humidity!=null?w.humidity+"%":"-"}</span><span>💨 바람 ${w.wind!=null?w.wind+"m/s":"-"}</span></div>
      <div class="w-week">${wk}</div>
    </div>

}

async function loadWeather(){
  try{
    let lat=37.5665, lon=126.9780, cityName=null, useGeo=true;
    const saved=localStorage.getItem("kbWeatherLoc");
    if(saved){ try{ const s=JSON.parse(saved); lat=s.lat; lon=s.lon; cityName=s.name; useGeo=false; }catch(e){} }
    if(useGeo){
      try{ const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:6000,maximumAge:600000})); lat=pos.coords.latitude; lon=pos.coords.longitude; }catch(e){}
    }
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day,relative_humidity_2m,wind_speed_10m&hourly=temperature_2m&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=7&wind_speed_unit=ms&timezone=auto`;
    const j=await (await fetch(url)).json();
    const cur=j.current||{};
    if(cur.temperature_2m===undefined) throw new Error("no data");
    const day=j.daily||{};
    const mx=Number((day.temperature_2m_max||[])[0]), mn=Number((day.temperature_2m_min||[])[0]);
    const m=mapWeather(cur.weather_code, cur.is_day);
    let city=cityName;
    if(!city){ try{ const gj=await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`)).json(); city=gj.city||gj.locality||gj.principalSubdivision||"현재 위치"; }catch(e){ city="현재 위치"; } }
    weatherData={
      temp:Math.round(cur.temperature_2m),
      max:isFinite(mx)?Math.round(mx):null, min:isFinite(mn)?Math.round(mn):null,
      label:m.label, emoji:m.emoji, cls:m.cls, city,
      humidity: cur.relative_humidity_2m!=null?Math.round(cur.relative_humidity_2m):null,
      wind: cur.wind_speed_10m!=null?Math.round(cur.wind_speed_10m*10)/10:null,
      hourly: buildHourly(j.hourly, cur.time),
      daily: buildDaily(day)
    };
    updateWeatherChip();
  }catch(e){ updateWeatherChip(); }
}

function loadHolidays(year){
  if(holYearsLoaded.has(year)) return;
  holYearsLoaded.add(year);
  Object.keys(FIXED_HOL).forEach(md=>{ if(!holidays[year+"-"+md]) holidays[year+"-"+md]=FIXED_HOL[md]; });   // 고정 공휴일 즉시 반영
  try{ const c=localStorage.getItem("kbHol_"+year); if(c){ Object.assign(holidays, JSON.parse(c)); } }catch(e){}
  fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/KR`).then(r=>r.ok?r.json():null).then(arr=>{
    if(!arr) return;
    const map={};
    arr.forEach(h=>{ if(h.date) map[h.date]=h.localName||h.name; });
    Object.assign(holidays, map);
    try{ localStorage.setItem("kbHol_"+year, JSON.stringify(map)); }catch(e){}
    if(currentTab==="cal") renderCal();
  }).catch(()=>{ holYearsLoaded.delete(year); });
}

/* =========================================================
   7. 일정관리 (캘린더)
   ========================================================= */
function renderCal(){
  const v=el("viewCal");
  const now=new Date();
  if(calYear===undefined){ calYear=now.getFullYear(); calMonth=now.getMonth(); selectedDate=todayStr(); }
  loadHolidays(calYear);
  if(calMonth===0) loadHolidays(calYear-1);
  if(calMonth===11) loadHolidays(calYear+1);

  const first=new Date(calYear,calMonth,1);
  const startDow=first.getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const today=todayStr();

  // 날짜별 이벤트 색상 모음
  const byDate={};
  entries("schedules").forEach(s=>{ (byDate[s.date]=byDate[s.date]||[]).push(s.color||"blue"); });

  let cells="";
  const dows=["일","월","화","수","목","금","토"];
  const dowRow=dows.map((d,i)=>`<div class="cal-dow" style="${i===0?'color:var(--red)':i===6?'color:var(--blue)':''}">${d}</div>`).join("");

  for(let i=0;i<42;i++){
    let dayNum, cls="cal-cell", inMonth=true, cellY=calYear, cellM=calMonth;
    if(i<startDow){ dayNum=prevDays-startDow+1+i; inMonth=false; cellM=calMonth-1; if(cellM<0){cellM=11;cellY--;} cls+=" other"; }
    else if(i>=startDow+daysInMonth){ dayNum=i-startDow-daysInMonth+1; inMonth=false; cellM=calMonth+1; if(cellM>11){cellM=0;cellY++;} cls+=" other"; }
    else dayNum=i-startDow+1;
    const dateStr=`${cellY}-${pad(cellM+1)}-${pad(dayNum)}`;
    const dow=(i%7);
    if(dow===0)cls+=" sun"; if(dow===6)cls+=" sat";
    const holName = holidays[dateStr];
    if(holName && inMonth) cls+=" hol";
    if(dateStr===today)cls+=" today";
    if(dateStr===selectedDate)cls+=" sel";
    const dots=(byDate[dateStr]||[]).slice(0,3).map(c=>`<i style="background:${EV_COLORS[c]||EV_COLORS.blue}"></i>`).join("");
    const holLabel = (holName && inMonth) ? `<div class="cal-hol">${esc(holName)}</div>` : "";
    cells+=`<div class="${cls}" onclick="selectDay('${dateStr}')">${dayNum}${holLabel}<div class="cal-dots">${dots}</div></div>`;
  }

  const dayEvents=entries("schedules").filter(s=>s.date===selectedDate)
    .sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));

  v.innerHTML=`
    <div class="card">
      <div class="cal-head">
        <div class="m">${calYear}년 ${calMonth+1}월</div>
        <div class="cal-nav">
          <button onclick="calMove(-1)">‹</button>
          <button class="today" onclick="calToday()">오늘</button>
          <button onclick="calMove(1)">›</button>
        </div>
      </div>
      <div class="cal-grid">${dowRow}${cells}</div>
    </div>

    <div class="day-list-head">
      <div class="d">${fmtDateK(selectedDate)}${holidays[selectedDate]?` <span style="color:var(--red);font-weight:800;">· ${esc(holidays[selectedDate])}</span>`:""}</div>
      <button class="add-mini" onclick="scheduleModal(null,'${selectedDate}')">+ 일정 추가</button>
    </div>
    <div>
      ${dayEvents.length? dayEvents.map(s=>`
        <div class="ev">
          <div class="bar" style="background:${EV_COLORS[s.color]||EV_COLORS.blue}"></div>
          <div class="chk ${s.done?'on':''}" onclick="toggleDone('${s.id}',event)">${s.done?'✓':''}</div>
          <div class="body" onclick="scheduleModal('${s.id}')">
            <div class="t ${s.done?'strike':''}">${esc(s.title)}</div>
            <div class="sub">${s.allday?'📌 종일  ':(s.time?'⏰ '+esc(s.time)+'  ':'')}${s.memo?esc(s.memo):''}</div>
          </div>
        </div>`).join("")
        : `<div class="empty"><span class="e-emoji">🗓️</span>이 날의 일정이 없어요</div>`}
    </div>
  `;
}
function selectDay(d){ selectedDate=d; renderCal(); }
function calMove(dir){ calMonth+=dir; if(calMonth<0){calMonth=11;calYear--;} if(calMonth>11){calMonth=0;calYear++;} renderCal(); }
function calToday(){ const n=new Date(); calYear=n.getFullYear(); calMonth=n.getMonth(); selectedDate=todayStr(); renderCal(); }
function toggleDone(id,e){ e.stopPropagation(); const s=store.schedules[id]; if(s) refPath("schedules/"+id+"/done").set(!s.done); }

function buildWheel(col, values, initialIndex){
  const H=44;
  col.innerHTML = values.map(v=>`<div class="it">${v}</div>`).join("");
  const setSel=()=>{ const idx=Math.min(values.length-1,Math.max(0,Math.round(col.scrollTop/H))); [...col.children].forEach((c,i)=>c.classList.toggle("sel", i===idx)); };
  col._get = ()=>Math.min(values.length-1,Math.max(0,Math.round(col.scrollTop/H)));
  col.addEventListener("scroll", setSel, {passive:true});
  const apply=()=>{ col.scrollTop=initialIndex*H; setSel(); };
  apply(); requestAnimationFrame(apply); setTimeout(apply,60);
}
function scheduleModal(id, date){
  const editing = !!id;
  const s = editing ? store.schedules[id] : {date:date||selectedDate||todayStr(), color:"blue", time:"09:00", title:"", memo:"", alarm:null};
  let h24=9, mm=0;
  if(s.time && /^\d{1,2}:\d{2}$/.test(s.time)){ h24=+s.time.split(":")[0]; mm=+s.time.split(":")[1]; }
  const ampm = h24>=12?1:0;
  let h12 = h24%12; if(h12===0) h12=12;
  const alarmSel = (s.alarm===undefined?null:s.alarm);
  openModal(`
    <h3>${editing?"일정 수정":"새 일정"}</h3>
    <label class="allday-row"><span>⏱️ 시간 상관없음 (종일)</span><input type="checkbox" id="mAllday" ${s.allday?"checked":""} onchange="toggleAllday(this.checked)"></label>
    <label style="display:block;font-size:13px;color:var(--t2);margin:2px 0 0;font-weight:700;text-align:center;">시간 선택</label>
    <div class="tp" id="tpWrap">
      <div class="tp-band"></div>
      <div class="tp-col ampm" id="tpAmpm"></div>
      <div class="tp-col hh" id="tpHH"></div>
      <div class="tp-colon">:</div>
      <div class="tp-col mm" id="tpMM"></div>
    </div>
    <div class="mcard">
      <div class="field"><label>제목</label><input id="mTitle" type="text" placeholder="무엇을 하나요?" value="${esc(s.title)}"></div>
      <div class="field"><label>날짜</label><input id="mDate" type="date" value="${s.date}"></div>
    </div>
    <div class="mcard">
      <div class="field"><label>알림 (앱 푸시)</label>
        <div class="alarm-chips" id="mAlarm">
          ${ALARM_OPTS.map(o=>`<button data-a="${o.v===null?'null':o.v}" class="${alarmSel===o.v?'sel':''}" onclick="pickAlarm(${o.v===null?'null':o.v})">${o.label}</button>`).join("")}
        </div>
      </div>
    </div>
    <div class="mcard">
      <div class="field"><label>색상</label>
        <div class="color-pick" id="mColor">
          ${Object.keys(EV_COLORS).map(c=>`<button data-c="${c}" class="${s.color===c?'sel':''}" style="background:${EV_COLORS[c]}" onclick="pickColor('${c}')"></button>`).join("")}
        </div>
      </div>
      <div class="field"><label>메모 (선택)</label><textarea id="mMemo" placeholder="상세 내용">${esc(s.memo||"")}</textarea></div>
    </div>
    <div class="modal-actions">
      ${editing?`<button class="btn-danger" onclick="delSchedule('${id}')">삭제</button>`:""}
      <button class="btn-ghost" onclick="closeModal()">닫기</button>
      <button class="btn-primary" style="flex:1" onclick="saveSchedule('${id||""}')">저장</button>
    </div>
  `);
  const root=el("modalRoot"); root._color=s.color; root._alarm=alarmSel; root._allday=!!s.allday;
  buildWheel(el("tpAmpm"), ["오전","오후"], ampm);
  buildWheel(el("tpHH"), Array.from({length:12},(_,i)=>String(i+1)), h12-1);
  buildWheel(el("tpMM"), Array.from({length:60},(_,i)=>pad(i)), mm);
  if(s.allday) el("tpWrap").classList.add("dim");
}
function toggleAllday(v){ el("modalRoot")._allday=v; el("tpWrap").classList.toggle("dim", v); }
function pickColor(c){
  el("modalRoot")._color=c;
  document.querySelectorAll("#mColor button").forEach(b=>b.classList.toggle("sel", b.dataset.c===c));
}
function pickAlarm(v){
  el("modalRoot")._alarm=v;
  document.querySelectorAll("#mAlarm button").forEach(b=>{ const bv = b.dataset.a==="null"?null:Number(b.dataset.a); b.classList.toggle("sel", bv===v); });
}
function saveSchedule(id){
  const title=el("mTitle").value.trim();
  if(!title){ toast("제목을 입력해 주세요"); return; }
  const allday=el("mAllday").checked;
  const ampmIdx=el("tpAmpm")._get(), h12=el("tpHH")._get()+1, mm=el("tpMM")._get();
  let h24=h12%12; if(ampmIdx===1) h24+=12;
  const root=el("modalRoot");
  const data={
    title,
    date:el("mDate").value,
    time: allday ? "" : pad(h24)+":"+pad(mm),
    allday: allday,
    memo:el("mMemo").value.trim(),
    color:root._color||"blue",
    alarm:(root._alarm===undefined?null:root._alarm)
  };
  if(id){ data.done=store.schedules[id].done||false; refPath("schedules/"+id).update(data); }
  else{ data.done=false; data.createdAt=Date.now(); refPath("schedules").push(data); }
  selectedDate=data.date;
  closeModal(); toast("저장했어요");
  setTimeout(checkAlarms, 300);
}
function delSchedule(id){
  confirmModal("일정 삭제","이 일정을 삭제할까요?",()=>{ refPath("schedules/"+id).remove(); closeModal(); toast("삭제했어요"); });

function saveMemo(id){
  const title=el("mmTitle").value.trim();
  const content=el("mmContent").value.trim();
  if(!title && !content){ toast("내용을 입력해 주세요"); return; }
  const data={title, content, color:el("modalRoot")._memoColor||"#3182F6", updatedAt:Date.now()};
  const rem=el("modalRoot")._memoRemind;
  if(rem==="custom"){
    const val=el("mmCustomAt").value;
    if(val){ const ts=new Date(val).getTime(); if(isNaN(ts)||ts<Date.now()-60000){ toast("알림 시간을 미래로 지정해 주세요"); return; } data.remindAt=ts; data.notified=false; }

  }   // rem===null → 기존 알림 그대로 유지
  if(id) refPath("memos/"+id).update(data);
  else { data.createdAt=Date.now(); data.done=false; refPath("memos").push(data); }

async function addPhotos(files){

// 이미지 압축 → base64 (긴 변 900px, JPEG 품질 0.7)
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const max=900;
        let {width:w,height:h}=img;
        if(w>h && w>max){ h=h*max/w; w=max; }
        else if(h>=w && h>max){ w=w*max/h; h=max; }
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        resolve(cv.toDataURL("image/jpeg",0.7));
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}

  }else{

function forceRefresh(){
  (async()=>{
    try{ if("caches" in window){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(e){}
    location.replace(location.origin + location.pathname + "?v=" + Date.now());

function updateNotifBtn(){
  const b=el("notifBtn"); if(!b) return;
  const p = ("Notification" in window) ? Notification.permission : "unsupported";
  b.classList.remove("on","off");
  if(p==="granted"){ b.classList.add("on"); b.innerHTML='🔔<span class="lbl">알림 켜짐</span>'; }
  else if(p==="denied"){ b.classList.add("off"); b.innerHTML='🔕<span class="lbl">알림 차단</span>'; }
  else { b.innerHTML='🔔<span class="lbl">알림 허용</span>'; }
}
async function requestNotif(){
  if(!("Notification" in window)){ toast("이 브라우저는 알림을 지원하지 않아요"); return; }
  if(Notification.permission==="granted"){ toast("이미 알림이 켜져 있어요"); updateNotifBtn(); return; }
  if(Notification.permission==="denied"){ toast("브라우저 설정에서 알림을 허용해 주세요"); return; }
  try{
    const p=await Notification.requestPermission(); updateNotifBtn();
    if(p==="granted"){ toast("알림이 켜졌어요"); setupFCM(); setTimeout(checkAlarms,300); }
  }catch(e){ toast("알림 설정에 실패했어요"); }
}
/* FCM: 토큰 발급·저장 + 포그라운드 메시지 처리 */
async function setupFCM(){
  try{
    if(!uid || Notification.permission!=="granted" || typeof firebase==="undefined" || !firebase.messaging) return;
    const reg = await navigator.serviceWorker.ready;
    const messaging = firebase.messaging();
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if(token){ fcmToken=token; db.ref(`users/${uid}/fcmTokens/${token}`).set(Date.now()); }
    messaging.onMessage(payload=>{
      const n=(payload && payload.notification)||{};
      showFgNotif(n.title||"📅 김비서", n.body||"");
    });
  }catch(e){ /* 미지원/실패 시 로컬 알림으로 폴백 */ }
}
function showFgNotif(title, body){
  try{ navigator.serviceWorker.ready.then(reg=>reg.showNotification(title, {body, icon:"icon-192.png", badge:"icon-192.png"})); }catch(e){}
}
function pruneFired(){
  try{ const f=JSON.parse(localStorage.getItem("kbFired")||"{}"); const cut=Date.now()-2*86400000; let ch=false;
    Object.keys(f).forEach(k=>{ const t=+String(k).split("@")[1]; if(t && t<cut){ delete f[k]; ch=true; } });
    if(ch) localStorage.setItem("kbFired", JSON.stringify(f));
  }catch(e){}
}
function showNotif(title, body, tag){
  const opts={ body, icon:"icon-192.png", badge:"icon-192.png", tag:tag||title, renotify:true, requireInteraction:true };
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg=>reg.showNotification(title, opts)).catch(()=>{ try{new Notification(title, opts);}catch(e){} });
    } else { new Notification(title, opts); }
  }catch(e){}
}
function showLocalNotif(s){
  const off=(ALARM_OPTS.find(o=>o.v===s.alarm)||{}).label||"";
  const body=`${fmtDateK(s.date)} ${s.time}${(off&&off!=="정각")?" ("+off+")":""}${s.memo?" · "+s.memo:""}`;
  showNotif("📅 "+s.title, body, "sch-"+s.id);
}
function checkAlarms(){
  if(!uid || !("Notification" in window) || Notification.permission!=="granted") return;
  if(fcmToken) return;   // FCM(서버 푸시) 활성 시 로컬 알림 생략(중복 방지)
  const now=Date.now();
  let fired; try{ fired=JSON.parse(localStorage.getItem("kbFired")||"{}"); }catch(e){ fired={}; }
  let changed=false;
  entries("schedules").forEach(s=>{
    if(s.alarm===undefined || s.alarm===null || s.done) return;
    const t = s.time || "09:00";   // 종일 일정은 오전 9시 기준으로 알림
    const dt=new Date(s.date+"T"+t+":00").getTime();
    if(isNaN(dt)) return;
    const at=dt - s.alarm*60000;
    const key=s.id+"@"+at;
    if(now>=at && now < at+6*60000 && !fired[key]){
      showLocalNotif(s); fired[key]=1; changed=true;
    }
  });
  entries("memos").forEach(m=>{
    if(!m.remindAt || m.notified || m.done) return;
    const at=Number(m.remindAt); if(isNaN(at)) return;
    const key="memo@"+m.id+"@"+at;
    if(now>=at && now < at+6*60000 && !fired[key]){
      showNotif("📝 "+(m.title||"메모"), (m.content||"").slice(0,80), "memo-"+m.id);
      fired[key]=1; changed=true;
      refPath("memos/"+m.id+"/notified").set(true);
    }
  });
  if(changed) localStorage.setItem("kbFired", JSON.stringify(fired));
}
